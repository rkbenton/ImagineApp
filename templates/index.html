<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ImagineApp</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
    <script defer src="{{ url_for('static', filename='script.js') }}"></script>
    <style>
        body {
            background-image: url('static/images/colorful_bird.png');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            background-color: #ffffff; /* Fallback color */
        }
    </style>
</head>
<body class="bg-light p-4">
<div class="container bg-white p-4 rounded shadow-lg mx-auto" style="max-width: 40rem;">
    <h1 class="fs-4 fw-bold mb-3">ImagineApp</h1>

    <!-- Error Modal (Startup Errors) -->
    {% if config_error %}
        <div class="modal fade" id="startup-error-modal" tabindex="-1" aria-labelledby="startupErrorModalLabel"
             aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content p-4">
                    <div class="modal-header">
                        <h5 class="modal-title text-danger" id="startupErrorModalLabel">Error</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <p>{{ config_error }}</p>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Close</button>
                    </div>
                </div>
            </div>
        </div>
    {% endif %}


    <!-- Display Duration -->
    <div class="d-flex align-items-center justify-content-between mb-3">
        <label>Display Duration (HH:MM:SS)</label>
        <button class="btn btn-link text-primary p-0" onclick="openModal('help-display-duration')">ℹ️</button>
    </div>
    <input type="text" id="display_duration" class="form-control" value="{{ config['display_duration'] }}">

    <!-- Full Screen Toggle -->
    <div class="d-flex align-items-center justify-content-between mt-4">
        <span>Full Screen</span>
        <div class="d-flex align-items-center">
            <div class="form-check form-switch">
                <input type="checkbox" id="full_screen" class="form-check-input"
                       {% if config['full_screen'] %}checked{% endif %}>
            </div>
            <button class="btn btn-link text-primary ms-2 p-0" onclick="openModal('help-full-screen')">ℹ️</button>
        </div>
    </div>

    <!-- Local Files Only Toggle -->
    <div class="d-flex align-items-center justify-content-between mt-4">
        <span>Slideshow - Local Files Only</span>
        <div class="d-flex align-items-center">
            <div class="form-check form-switch">
                <input type="checkbox" id="local_files_only" class="form-check-input"
                       {% if config['local_files_only'] %}checked{% endif %}>
            </div>
            <button class="btn btn-link text-primary ms-2 p-0" onclick="openModal('help-local-files')">ℹ️</button>
        </div>
    </div>

    <!-- Min Rating -->
    <div class="d-flex align-items-center justify-content-between mt-4">
        <span>Minimum Rating for Slideshow</span>
        <input type="number"
               id="minimum_rating_filter"
               name="minimum_rating_filter"
               min="0"
               max="5"
               step="1"
               value="{{ config.minimum_rating_filter | round | int }}"
               class="form-control w-auto ms-auto">
        <button class="btn btn-link text-primary ms-2 p-0" onclick="openModal('help-min-rating')">ℹ️</button>
    </div>

    <!-- Max Num Saved Files -->
    <div class="d-flex align-items-center justify-content-between mt-4">
        <label>Max Num Saved Files</label>
        <button class="btn btn-link text-primary p-0" onclick="openModal('help-max-files')">ℹ️</button>
    </div>
    <input type="number" id="max_num_saved_files" class="form-control mb-3"
           value="{{ config['max_num_saved_files'] }}">

    <!-- Background Color Picker -->
    <div class="d-flex align-items-center justify-content-between mt-4">
        <label>Background Color</label>
        <button class="btn btn-link text-primary p-0" onclick="openModal('help-bg-color')">ℹ️</button>
    </div>
    <input type="color" id="background_color" class="form-control mb-3"
           value="{{ config['background_color'] }}">

    <!-- Active Theme -->
    <div class="d-flex align-items-center justify-content-between mt-4">
        <label>Active Theme</label>
        <button class="btn btn-link text-primary p-0" onclick="openModal('help-theme')">ℹ️</button>
    </div>
    <select id="active_theme" class="form-select mb-3">
        {% for theme_name in all_theme_names %}
            <option value="{{ theme_name }}"
                    {% if current_theme_display_name == theme_name %}selected{% endif %}>
                {{ theme_name }}
            </option>
        {% endfor %}
    </select>

    <!-- Active Style -->
    <div class="d-flex align-items-center justify-content-between mt-4">
        <label>Active Style</label>
        <button class="btn btn-link text-primary p-0" onclick="openModal('help-style')">ℹ️</button>
    </div>
    <select id="active_style" class="form-select mb-3">
        {% for style_name in current_styles %}
            <option value="{{ style_name }}" {% if config['active_style'] == style_name %}selected{% endif %}>
                {{ style_name }}
            </option>
        {% endfor %}
    </select>


    <!-- Action Buttons -->
    <div class="d-flex justify-content-between mt-4">
        <button id="revertBtn" class="btn btn-secondary">Revert</button>
        <button id="updateBtn" class="btn btn-primary">Update</button>
    </div>

    <!-- "Top Sneaky" Button -->
    <div class="text-center mt-4">
        <a href="/file-management" class="btn btn-sm text-primary" style="background-color: #001f3f; color: #00bfff;">
            Top Sneaky
        </a>
    </div>
</div>
<!-- Error Modal -->
<div class="modal fade" id="error-modal" tabindex="-1" aria-labelledby="errorModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title text-danger" id="errorModalLabel">Error</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <p id="error-message"></p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-danger" data-bs-dismiss="modal" onclick="closeErrorModal()">
                    Close
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Help Modal -->
<div id="modal-container" class="modal fade" tabindex="-1" aria-labelledby="modalTitle" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalTitle"></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <p id="modal-text"></p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>


<script>
    document.addEventListener("DOMContentLoaded", function () {
        var errorModalEl = document.getElementById("startup-error-modal");
        if (errorModalEl) {
            var errorModal = new bootstrap.Modal(errorModalEl);
            errorModal.show();
        }
    });
</script>
</body>
</html>
