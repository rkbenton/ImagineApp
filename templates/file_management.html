<!-- File Management Page (file_management.html) -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Management</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-image: url('static/images/colorful_bird.png');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            background-color: #ffffff;
        }
        /* Loading indicator styles */
        .htmx-indicator {
            opacity: 0;
            transition: opacity 200ms ease-in;
        }
        .htmx-request .htmx-indicator {
            opacity: 1;
        }
        .htmx-request.htmx-indicator {
            opacity: 1;
        }
    </style>
</head>
<body class="bg-light p-4">
<div class="container bg-white p-4 rounded shadow-lg mx-auto" style="max-width: 40rem;">
    <h1 class="fs-4 fw-bold mb-3">File Management</h1>

    <!-- Lazy-loaded file statistics -->
    <div hx-get="/total_files"
         hx-trigger="load"
         hx-swap="innerHTML"
         class="mb-4 p-3 border rounded">
        <div class="htmx-indicator text-center">
            <div class="spinner-border spinner-border-sm text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-2 text-muted">Loading file statistics...</p>
        </div>
    </div>

    <!-- Back Button -->
    <div class="text-center mt-4">
        <a href="/" class="btn btn-secondary">Back to Home</a>
    </div>
</div>
</body>
</html>
