[project]
name = "imagineapp"
version = "0.1.0"
description = "Flask web app for AI image generation and S3 sync"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.18",
    "flask>=3.1.3",
    "gunicorn>=26.0.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
]

[tool.uv]
exclude-newer = "1 week"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
